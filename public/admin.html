<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle Strategy Admin</title>
<link rel="icon" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
<style>
  .shell { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }
  .head { position: sticky; top: 0; z-index: 10; background: var(--stone); padding: 14px 0 12px; }
  .head-in { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 850; font-size: 1.15rem; }
  .brand img { width: 36px; height: 36px; }
  .status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .timer-s { font-size: 1.6rem; font-weight: 850; min-width: 3.2em; text-align: right; }
  .timer-s.low { color: var(--gules); }
  nav.sect { display: flex; gap: 6px; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .control { display: flex; gap: 10px; flex-wrap: wrap; }
  .plan-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .plan-row:first-child { border-top: 0; }
  .plan-n { font-weight: 850; color: var(--muted); text-align: center; }
  .teamcard { display: grid; gap: 12px; }
  .code-big { font-size: 2rem; font-weight: 850; letter-spacing: .18em; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .pchip { display: inline-flex; align-items: center; gap: 4px; background: var(--stone); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: .85rem; }
  .pchip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 999px; font-weight: 700; }
  .pchip button:hover { background: var(--gules-soft); color: var(--gules); }
  .pchip select { width: auto; padding: 2px 4px; font-size: .78rem; border-radius: 8px; border-width: 1px; }
  .round-ed { display: grid; grid-template-columns: 2.2em 1fr; gap: 12px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .savebar { position: sticky; bottom: 12px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; background: var(--paper); border-radius: 999px; padding: 8px 8px 8px 20px; box-shadow: var(--shadow); margin-top: 16px; }
  .mode-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .src { font-size: .72rem; font-weight: 700; color: var(--muted); }
  input[type=color] { width: 44px; height: 40px; padding: 2px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); }
  .login { max-width: 380px; margin: 12vh auto; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .92rem; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/vendor/qrcode.js"></script>
<script src="/static/common.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
